version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: collections-postgres
    environment:
      POSTGRES_DB: collections_intelligence
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d collections_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
